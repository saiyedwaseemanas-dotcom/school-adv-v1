name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Ensure Capacitor and Cordova Configurations
        run: |
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          mkdir -p android/app/libs
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          // Generated fallback for CI compatibility
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF
          fi
          if [ ! -f "android/capacitor-cordova-android-plugins/build.gradle" ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          android {
              namespace = "capacitor.cordova.android.plugins"
              compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
              defaultConfig {
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
              }
          }
          EOF
          fi
          chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp -f {} build-artifacts/ \; || true
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/EduTrack-debug.apk
            echo "Copied EduTrack-debug.apk"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp -f android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/EduTrack-release-unsigned.apk
            echo "Copied EduTrack-release-unsigned.apk"
          fi
          ls -la build-artifacts/

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
