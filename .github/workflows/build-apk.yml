name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android

      - name: Prepare Android Directories and Permissions
        run: |
          mkdir -p android/app/libs
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp -f {} build-artifacts/ \; 2>/dev/null || true
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/EduTrack-debug.apk
            echo "Copied EduTrack-debug.apk"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp -f android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/EduTrack-release-unsigned.apk
            echo "Copied EduTrack-release-unsigned.apk"
          fi
          echo "### 📱 Android Build Status" >> $GITHUB_STEP_SUMMARY
          echo "Generated APK artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -lh build-artifacts/*.apk 2>/dev/null | awk '{print "- **" $9 "** (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No APKs found" >> $GITHUB_STEP_SUMMARY
          ls -la build-artifacts/

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
